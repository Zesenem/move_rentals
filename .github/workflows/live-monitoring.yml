name: Live site monitoring

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
      - name: Verify Node.js runtime
        run: node --version
      - run: npm ci
      - run: npm run check:live-content
      - run: npm run test:lighthouse:live
      - run: npm run test:lighthouse:live-admin
