[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms-and-conditions"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/motorcycle/:slug"
  to = "/index.html"
  status = 200

# This stays last: static files and the routes above take precedence.
# It gives paths outside the app's public route patterns a real HTTP 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.google.com https://*.googlesyndication.com https://cdn.jsdelivr.net https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; frame-src 'self' *.google.com; connect-src 'self' https://move-rentals.com https://*.netlify.app https://www.google-analytics.com https://*.google-analytics.com https://stats.g.doubleclick.net *.sentry.io https://*.google.com https://*.googlesyndication.com; img-src 'self' data: https://www.facebook.com https://images.twicecommerce.com https://firebasestorage.googleapis.com https://purecatamphetamine.github.io https://images.pexels.com; media-src 'self' https://videos.pexels.com; form-action 'self'; base-uri 'self'; object-src 'none'; worker-src 'self' blob:;"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

